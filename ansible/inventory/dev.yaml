---
all:

nomad:
  children:
    linux_nomad_sn:
      hosts:
        hl1-lnomadsn-01:
      vars:
        nomad: true

    linux_nomad_cn:
      hosts:
        hl1-lnomadcn-01:
      vars:
        docker_users: 
          - nomad
        nomad_client: true
        docker_networks: false

    windows_nomad_cn:
      hosts:
        winnomadcn01:  # <-- Gave the Windows node a proper identifier

    consul:
      children:
        linux_consul:
          hosts:
            hl1-lconsul-01:
          vars:
            consul: true

